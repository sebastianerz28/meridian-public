<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><rect width="900" height="520" fill="#0b1020"/><text x="75" y="42" fill="#f8fafc" font-size="25" font-family="Segoe UI, sans-serif" font-weight="700">Cost per repeated seed pair</text><text x="75" y="68" fill="#94a3b8" font-size="14" font-family="Segoe UI, sans-serif">Each pair contains two independent 20-turn executions</text><text x="75" y="131" fill="#cbd5e1" font-size="16" font-family="Segoe UI, sans-serif">Full process + SQLite</text><rect x="75" y="145" width="650.00" height="56" rx="8" fill="#f59e0b"/><text x="735.00" y="181" fill="#f8fafc" font-size="15" font-family="Consolas, monospace">601.312 ms</text><text x="75" y="276" fill="#cbd5e1" font-size="16" font-family="Segoe UI, sans-serif">In-process stochastic engine</text><rect x="75" y="290" width="1.55" height="56" rx="8" fill="#38bdf8"/><text x="86.55" y="326" fill="#f8fafc" font-size="15" font-family="Consolas, monospace">1.435 ms</text><text x="75" y="470" fill="#94a3b8" font-size="13" font-family="Segoe UI, sans-serif">Process mode includes CLR startup, filesystem work, SQLite schema/transactions, serialization, and output rendering.</text></svg>